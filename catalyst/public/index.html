<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalyst — event radar & screener</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{--bg:#000;--p1:#08080a;--p2:#101013;--line:#1b1b20;--line2:#2b2b33;--ink:#f4f4f5;--ink2:#a5a5b0;--ink3:#6c6c78;--accent:#c8ff3e;--up:#0ca30c;--down:#e66767;--ma:#9085e9;--fda:#199e70;--earn:#c98500;--event:#d55181;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 420px at 15% -10%,rgba(200,255,62,.07),transparent 62%),radial-gradient(760px 380px at 95% -12%,rgba(167,139,250,.07),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}
h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}h2{font-size:15px}h3{font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.up{color:var(--up)}.dn{color:var(--down)}.sub{color:var(--ink3);font-size:12px}.num{text-align:right;white-space:nowrap}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1f1f25;border-radius:8px;border:2px solid #000}

header{position:sticky;top:0;z-index:500;display:flex;align-items:center;gap:18px;padding:12px 22px;background:rgba(0,0,0,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.22em;font-size:13px}
.brand svg{width:22px;height:22px}
#search{flex:1;max-width:240px}
#q{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:0;transition:border-color .15s,box-shadow .15s}
#q:focus,select:focus,textarea:focus,input[type=number]:focus,#tagform input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,255,62,.12)}
#q::placeholder,textarea::placeholder,input::placeholder{color:var(--ink3)}
#tabs{display:flex;gap:4px;background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:3px}
#tabs button{padding:6px 14px;border-radius:8px;color:var(--ink2);font-weight:500;white-space:nowrap;transition:.15s}
#tabs button:hover{color:var(--ink)}#tabs button.on{background:var(--ink);color:#000}
#sources{margin-left:auto;display:flex;gap:6px;align-items:center}
#sources i{width:7px;height:7px;border-radius:50%;background:var(--up)}#sources i.bad{background:var(--down)}#sources span{color:var(--ink3);font-size:12px;margin-right:4px}

main{padding:22px;max-width:1680px;margin:0 auto;position:relative}
.view{display:none}.view.on{display:block}
#v-screener.on{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.panel,.card{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:var(--r)}
.panel{padding:18px}.card{padding:16px;margin-bottom:14px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.ghost{color:var(--ink2);font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;transition:.15s}.ghost:hover{color:var(--ink);border-color:var(--line2)}
.primary{width:100%;background:var(--accent);color:#000;font-weight:650;padding:9px;border-radius:10px;margin:10px 0 14px;transition:filter .15s,transform .05s}.primary:hover{filter:brightness(1.08)}.primary:active{transform:scale(.99)}
label.f{display:block;color:var(--ink2);font-size:12px;margin-bottom:10px}
select,textarea,input[type=number],#tagform input{width:100%;margin-top:5px;background:#000;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:0;color:var(--ink)}
textarea{resize:vertical;margin-top:0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);transition:.15s;white-space:nowrap}.chip:hover{border-color:var(--line2);color:var(--ink)}.chip.on{background:var(--ink);color:#000;border-color:var(--ink)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:12px;font-size:12px;color:var(--ink2)}
.sl span i,.lab i,.thesis i,.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
.sl output{color:var(--ink)}.sl input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:var(--line2);outline:0;margin:8px 0 2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid #000;box-shadow:0 0 0 1px var(--line2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--ink);border:3px solid #000;cursor:pointer}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink2);margin:12px 0;cursor:pointer}
.tog input{display:none}.tog b{width:30px;height:17px;border-radius:999px;background:var(--line2);position:relative;transition:.15s}.tog b::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--ink3);transition:.15s}
.tog input:checked+b{background:var(--accent)}.tog input:checked+b::after{left:15px;background:#000}

#bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin:-4px 0 12px}#bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tw{overflow-x:auto;margin:0 -18px -18px;padding:0 0 6px}
table{width:100%;border-collapse:collapse;min-width:960px}
th{position:sticky;top:0;text-align:left;font-size:11px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}th.on{color:var(--ink)}th.num{text-align:right}
td{padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover{background:rgba(255,255,255,.035)}tbody tr:last-child td{border-bottom:0}
.co b{display:block;font-weight:650;letter-spacing:.02em}.co span{color:var(--ink3);font-size:12px;display:block;max-width:165px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{width:58px;min-width:52px}.sc b{font-weight:600}.sc i{display:block;height:3px;border-radius:2px;margin-top:5px;background:linear-gradient(90deg,var(--c) var(--v),var(--line) var(--v))}
.sc.big b{font-size:16px}
.dv{position:relative;display:block;height:3px;border-radius:2px;background:var(--line);margin-top:5px}.dv::before{content:"";position:absolute;left:50%;top:-2px;width:1px;height:7px;background:var(--ink3)}.dv em{position:absolute;top:0;height:3px;border-radius:2px}
.why{color:var(--ink2);font-size:12px;max-width:0;width:100%;min-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:var(--line2);font-size:15px;line-height:1;transition:.15s}.star:hover{color:var(--ink2)}.star.on{color:var(--accent)}
.sk td{padding:15px 12px}.sk span{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,#141418,#1e1e24,#141418);background-size:200% 100%;animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.empty{color:var(--ink3);padding:26px 8px;text-align:center;font-size:13px}
.tag{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}

.feed{max-width:980px;margin:0 auto}.feed h2{margin:22px 4px 10px;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:500}
.row{display:grid;grid-template-columns:86px 64px 84px 1fr;gap:12px;align-items:baseline;padding:11px 14px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .d{color:var(--ink3);font-size:12px}.row .t{font-weight:650;cursor:pointer}.row .t:hover{color:var(--accent)}.row .x{color:var(--ink2)}.feed .card{padding:4px 2px}

#v-jets.on{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
#map{height:calc(100vh - 120px);min-height:460px;border-radius:var(--r);border:1px solid var(--line);background:#050506;overflow:hidden}
#jetside{max-height:calc(100vh - 120px);overflow:auto}
.leaflet-container{background:#050506;font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111114;color:var(--ink);border:1px solid var(--line2);box-shadow:0 10px 40px #000}.leaflet-popup-content{margin:12px 14px;line-height:1.5}
.leaflet-bar a,.leaflet-bar a:hover{background:#111114;color:var(--ink);border-color:var(--line2)}.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:var(--ink3)}.leaflet-control-attribution a{color:var(--ink2)}
.pl{width:18px;height:18px;filter:drop-shadow(0 0 3px #000)}.pl.near{fill:var(--earn)}.pl.tagd{fill:var(--accent)}
.hq{display:inline-flex;gap:5px;align-items:center;transform:translate(-50%,-50%);background:#000;border:1px solid var(--line2);border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:650;letter-spacing:.04em;white-space:nowrap}.hq.hot{border-color:var(--earn)}.hq b{color:var(--earn)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}.kpis b{display:block;font-size:22px;font-weight:650;letter-spacing:-.02em}.kpis span{color:var(--ink3);font-size:11.5px;line-height:1.3;display:block}
.jl{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.jl:last-child{border:0}.jl small{color:var(--ink3)}
#tagform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}#tagform input{margin:0}#tagform button{background:var(--ink);color:#000;font-weight:600;border-radius:9px;padding:0 14px}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);font-weight:400}.key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:900}#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100vw);background:#030304;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:1000;overflow-y:auto;padding:22px}
#drawer.on{transform:none}
.dh{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}.dh .tk{font-size:26px;font-weight:700;letter-spacing:-.01em;display:flex;gap:10px;align-items:center}.dh .nm{color:var(--ink2)}
.dh .px{margin-left:auto;text-align:right}.dh .px b{display:block;font-size:22px;font-weight:650}.dh .x{color:var(--ink3);font-size:16px;padding:4px 8px;border-radius:8px}.dh .x:hover{color:var(--ink);background:var(--p2)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{position:relative;width:112px;height:112px}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:700;letter-spacing:-.03em}
.eyebrow{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.thesis{list-style:none;margin:0;padding:0}.thesis li{padding:4px 0;color:var(--ink2);display:flex;align-items:baseline}.thesis li i{flex:none}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px}.tile .lab{font-size:11.5px;color:var(--ink2);display:flex;align-items:center}.tile b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em;margin:4px 0 0}.tile em{font-style:normal;font-size:11.5px;color:var(--ink3);display:block;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:3px;border-radius:2px;background:var(--line)}.meter i{display:block;height:100%;border-radius:2px}
.chart{width:100%;height:auto;display:block;overflow:visible}.chart text{font-size:10.5px;fill:var(--ink3)}.chart .val{fill:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2 .card{margin:0}
.evi{list-style:none;margin:0;padding:0}.evi li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}.evi li:last-child{border:0}.evi .w{color:var(--ink3);font-size:12px}.evi .d{color:var(--ink3);font-size:12px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px}.stats div span{display:block;color:var(--ink3);font-size:11.5px}.stats div b{font-weight:600}
.fdat{min-width:0;font-size:13px}.fdat td,.fdat th{padding:8px 8px 8px 0;cursor:default}.fdat tbody tr{cursor:default}.fdat tbody tr:hover{background:none}
.odds{display:flex;align-items:center;gap:8px;min-width:96px}.odds .meter{flex:1}
.nw{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.nw:last-child{border:0}.nw .dot{margin:6px 0 0}.nw .m{color:var(--ink3);font-size:12px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;gap:2px;height:6px;margin:10px 0 6px}.stack i{border-radius:3px;min-width:3px}
.fil{display:grid;grid-template-columns:86px 96px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.fil:last-child{border:0}.fil span:first-child{color:var(--ink3)}.fil span:last-child{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:var(--ink3);font-size:11.5px;line-height:1.5;margin-top:10px}
#tip{position:fixed;z-index:2000;pointer-events:none;background:#16161a;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:0 8px 30px #000;opacity:0;transition:opacity .1s;max-width:280px}#tip.on{opacity:1}
.fch{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.call{font-size:20px;font-weight:700;padding:8px 16px;border-radius:12px;border:1px solid var(--line2);white-space:nowrap}.call.up{border-color:var(--up);background:rgba(12,163,12,.12)}.call.dn{border-color:var(--down);background:rgba(230,103,103,.12)}
.fac{display:grid;grid-template-columns:200px 1fr 130px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}.fac .dv{margin:0}
.wide{max-width:1180px}.wide .card{padding:16px}#optform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 16px}#optform input{width:170px;margin:0;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;text-transform:uppercase}#optform button[type=submit]{background:var(--accent);color:#000;font-weight:650;padding:9px 18px;border-radius:10px}
.exps{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chainwrap{max-height:68vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.chain{min-width:720px;font-size:13px}.chain th{background:#0b0b0e;cursor:default;text-align:right;z-index:2}.chain th.k,.chain td.k{text-align:center;font-weight:650;background:#0b0b0e;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.chain td{text-align:right;padding:7px 10px;white-space:nowrap}.chain tbody tr{cursor:default}.chain td.g{background:rgba(12,163,12,.16)}.chain td.r{background:rgba(230,103,103,.13)}.chain td.g i{color:var(--up);font-style:normal}.chain td.r i{color:var(--down);font-style:normal}.chain td.o{font-weight:600}
.chain tr.spot td{text-align:center;background:var(--accent);color:#000;font-weight:650;padding:3px;font-size:12px}
.prov{padding:14px 0;border-top:1px solid var(--line)}.prov:first-of-type{border-top:0}.prov h4{margin:0 0 3px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}.prov h4 a{font-size:12px;font-weight:400;color:var(--accent);white-space:nowrap}.prov .rowi{display:flex;gap:8px;margin-top:8px;align-items:center}.prov input[type=text],.prov input[type=password]{flex:1;background:#000;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:0;min-width:0}.prov .res{font-size:12px;margin-top:6px;min-height:16px}
.links a{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.links a:first-child{border:0}.links a span{color:var(--ink3);font-size:12px;text-align:right}
@media(max-width:1000px){.fac{grid-template-columns:1fr 90px}.fac .sub{display:none}header{flex-wrap:wrap;gap:10px;padding:10px 14px}#search{order:3;max-width:none;flex-basis:100%}#tabs{overflow-x:auto;max-width:100%}#sources span{display:none}main{padding:14px}#v-screener.on,#v-jets.on{grid-template-columns:1fr}#map{height:56vh}#jetside{max-height:none}.tiles{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.row{grid-template-columns:70px 56px 1fr}.row .tag{display:none}#drawer{padding:14px}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10.5" stroke="#2b2b33"/><circle cx="12" cy="12" r="6" stroke="#6c6c78"/><path d="M12 12 19.5 6" stroke="#c8ff3e" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#c8ff3e"/></svg>CATALYST</div>
  <form id="search"><input id="q" placeholder="Analyze any ticker…   press /" autocomplete="off" spellcheck="false" aria-label="Analyze a ticker"></form>
  <nav id="tabs"><button data-v="screener" class="on">Screener</button><button data-v="options">Options</button><button data-v="calendar">Calendar</button><button data-v="signals">Signal tape</button><button data-v="jets">Jet tracker</button></nav>
  <div id="sources"></div>
  <button class="ghost" data-settings>API keys</button>
</header>
<main>
  <section id="v-screener" class="view on">
    <aside class="panel">
      <div class="ph"><h2>Screen</h2><button class="ghost" id="reset">Reset</button></div>
      <label class="f">Universe<select id="uni"></select></label>
      <textarea id="custom" rows="2" placeholder="…or paste your own tickers: AAPL, VRTX, ROKU"></textarea>
      <button class="primary" id="run">Run screen</button>
      <div class="chips" id="screens"></div>
      <div id="crit"></div>
      <button class="ghost" id="save">Save this screen</button>
    </aside>
    <div class="panel">
      <div class="ph"><h2 id="count">Results</h2><button class="ghost" id="csv">Export CSV</button></div>
      <div id="bar"><i></i></div>
      <div class="tw"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </section>
  <section id="v-options" class="view"><div class="feed wide" id="options"></div></section>
  <section id="v-calendar" class="view"><div class="feed" id="calendar"></div></section>
  <section id="v-signals" class="view"><div class="feed" id="signals"></div></section>
  <section id="v-jets" class="view"><div id="map"></div><aside id="jetside"></aside></section>
</main>
<div id="scrim" data-close></div>
<aside id="drawer" aria-label="Company detail"></aside>
<div id="tip"></div>
<script src="vendor/leaflet.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
'use strict';
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const href = u => (/^https?:\/\//i.test(u || '') ? esc(u) : '#');
const store = (k, v) => (v === undefined ? JSON.parse(localStorage.getItem('catalyst.' + k) || 'null') : localStorage.setItem('catalyst.' + k, JSON.stringify(v)));
const api = async (p, opt) => { const r = await fetch(p, opt), j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Request failed'); return j; };
const fPct = (x, d = 1) => (x == null ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + '%');
const fMoney = v => { if (v == null) return '—'; const a = Math.abs(v); return (v < 0 ? '−' : '') + '$' + (a >= 1e12 ? (a / 1e12).toFixed(2) + 'T' : a >= 1e9 ? (a / 1e9).toFixed(1) + 'B' : a >= 1e6 ? (a / 1e6).toFixed(0) + 'M' : a.toFixed(0)); };
const fDate = (d, yr) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', yr ? { month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' });
const ago = t => { const h = (Date.now() - t) / 36e5; return h < 1 ? 'just now' : h < 24 ? Math.round(h) + 'h ago' : Math.round(h / 24) + 'd ago'; };
const CATS = { merger: ['M&A', 'var(--ma)'], fda: ['FDA', 'var(--fda)'], earnings: ['Earnings', 'var(--earn)'], event: ['Event radar', 'var(--event)'] };
const CAT_COLOR = { 'M&A': 'var(--ma)', FDA: 'var(--fda)', Earnings: 'var(--earn)', Event: 'var(--event)' };
const CAPS = { micro: [0, 3e8], small: [3e8, 2e9], mid: [2e9, 1e10], large: [1e10, 2e11], mega: [2e11, Infinity] };
const SCREENS = { 'Takeover radar': { merger: 30 }, 'FDA catalysts': { fda: 45, bio: true }, 'Earnings soon': { earnDays: 14 }, 'Unusual activity': { event: 25 }, 'Bullish news': { sent: 30 } };

const S = { tickers: [], res: {}, crit: store('crit') || {}, sort: ['overall', -1], watch: new Set(store('watch') || []), saved: store('screens') || {}, universes: {}, view: 'screener', gen: 0, done: 0, tape: 'All' };
const ok = () => S.tickers.map(t => S.res[t]).filter(r => r && !r.error);

// ---------- Screener ----------
const COLS = [['ticker', 'Company', r => r.ticker], ['price', 'Price', r => r.price?.last, 1], ['chg', '1D', r => r.price?.chg1d, 1], ['overall', 'Catalyst', r => r.scores.overall], ['merger', 'M&A', r => r.scores.merger], ['fda', 'FDA', r => r.scores.fda], ['earnings', 'Earnings', r => r.scores.earnings], ['event', 'Event', r => r.scores.event], ['sentiment', 'News', r => r.scores.sentiment], ['next', 'Next earnings', r => r.earnings.daysTo, 1], ['mcap', 'Mkt cap', r => r.fund?.mcap, 1]];
const SLIDERS = [['overall', 'Catalyst score', 'var(--accent)'], ['merger', 'M&A signal', 'var(--ma)'], ['fda', 'FDA catalyst', 'var(--fda)'], ['earnings', 'Earnings setup', 'var(--earn)'], ['event', 'Event radar', 'var(--event)']];

function passes(r) {
  const c = S.crit, s = r.scores;
  for (const [k] of SLIDERS) if (c[k] && (s[k] ?? -1) < c[k]) return false;
  if (c.sent != null && s.sentiment < c.sent) return false;
  if (c.earnDays && !(r.earnings.daysTo != null && r.earnings.daysTo <= c.earnDays)) return false;
  if (c.cap) { const m = r.fund?.mcap, [lo, hi] = CAPS[c.cap]; if (m == null || m < lo || m >= hi) return false; }
  if (c.vol && !((r.price?.volRatio || 0) >= c.vol)) return false;
  if (c.growth != null && !((r.fund?.revGrowth ?? -9) * 100 >= c.growth)) return false;
  if (c.price && !((r.price?.last || 0) >= c.price)) return false;
  if (c.bio && !r.bio) return false;
  if (c.starred && !S.watch.has(r.ticker)) return false;
  return true;
}

function renderCrit() {
  const c = S.crit;
  const sel = (k, label, opts) => `<label class="f">${label}<select data-k="${k}">${opts.map(([v, t]) => `<option value="${v}"${String(c[k] ?? '') === String(v) ? ' selected' : ''}>${t}</option>`).join('')}</select></label>`;
  const tog = (k, label) => `<label class="tog">${label}<input type="checkbox" data-k="${k}"${c[k] ? ' checked' : ''}><b></b></label>`;
  $('#crit').innerHTML = SLIDERS.map(([k, n, col]) => `<label class="sl"><span><i style="background:${col}"></i>${n}</span><output>${c[k] ? '≥ ' + c[k] : 'Any'}</output><input type="range" min="0" max="100" step="5" value="${c[k] || 0}" data-k="${k}"></label>`).join('')
    + `<label class="sl"><span>News sentiment</span><output>${c.sent != null ? '≥ ' + c.sent : 'Any'}</output><input type="range" min="-100" max="100" step="10" value="${c.sent ?? -100}" data-k="sent"></label>`
    + sel('earnDays', 'Earnings within', [['', 'Any time'], [7, '7 days'], [14, '14 days'], [30, '30 days'], [60, '60 days']])
    + sel('cap', 'Market cap', [['', 'Any size'], ['micro', 'Micro · under $300M'], ['small', 'Small · $300M–2B'], ['mid', 'Mid · $2B–10B'], ['large', 'Large · $10B–200B'], ['mega', 'Mega · over $200B']])
    + sel('vol', 'Volume vs normal', [['', 'Any'], [1.2, 'At least 1.2x'], [1.5, 'At least 1.5x'], [2, 'At least 2x']])
    + sel('growth', 'Revenue growth', [['', 'Any'], [0, 'Growing'], [10, 'At least 10%'], [25, 'At least 25%']])
    + `<label class="f">Minimum price<input type="number" min="0" step="1" placeholder="$ any" value="${c.price || ''}" data-k="price"></label>`
    + tog('bio', 'Biotech & pharma only') + tog('starred', 'Watchlist only');
  const all = { ...SCREENS, ...S.saved }, cur = JSON.stringify(c);
  $('#screens').innerHTML = Object.keys(all).map(n => `<button class="chip${JSON.stringify(all[n]) === cur ? ' on' : ''}" data-screen="${esc(n)}">${esc(n)}</button>`).join('');
}

$('#crit').addEventListener('input', e => {
  const el = e.target, k = el.dataset.k, c = S.crit;
  if (!k) return;
  if (el.type === 'checkbox') el.checked ? (c[k] = true) : delete c[k];
  else if (el.value === '' || (el.type === 'range' && +el.value === +el.min)) delete c[k];
  else c[k] = k === 'cap' ? el.value : +el.value;
  if (el.type === 'range') el.previousElementSibling.textContent = c[k] != null ? '≥ ' + c[k] : 'Any';
  store('crit', c); renderTable();
  const cur = JSON.stringify(c), all = { ...SCREENS, ...S.saved };
  document.querySelectorAll('[data-screen]').forEach(b => b.classList.toggle('on', JSON.stringify(all[b.dataset.screen]) === cur));
});

const scoreCell = (v, col, big) => (v == null ? '<td class="sc sub">—</td>' : `<td class="sc${big ? ' big' : ''}"><b>${v}</b><i style="--v:${v}%;--c:${col}"></i></td>`);
const sentBar = v => `<span class="dv"><em style="width:${Math.abs(v) / 2}%;${v >= 0 ? 'left:50%' : `right:50%`};background:${v >= 0 ? 'var(--up)' : 'var(--down)'}"></em></span>`;

function renderTable() {
  const [key, dir] = S.sort, get = COLS.find(c => c[0] === key)[2];
  const rows = ok().filter(passes).sort((a, b) => { const x = get(a), y = get(b); return x == null ? 1 : y == null ? -1 : (x < y ? -1 : x > y ? 1 : 0) * dir; });
  const pending = S.tickers.filter(t => !S.res[t]).length, failed = S.tickers.filter(t => S.res[t]?.error).length;
  $('#thead').innerHTML = '<tr><th></th>' + COLS.map(([k, n, , num]) => `<th data-sort="${k}" class="${num ? 'num ' : ''}${k === key ? 'on' : ''}">${n}${k === key ? (dir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('') + '<th>Top signal</th></tr>';
  $('#tbody').innerHTML = rows.map(r => {
    const p = r.price, s = r.scores, e = r.earnings;
    return `<tr data-open="${esc(r.ticker)}"><td><button class="star${S.watch.has(r.ticker) ? ' on' : ''}" data-star="${esc(r.ticker)}" title="Watchlist">★</button></td>
      <td class="co"><b>${esc(r.ticker)}</b><span>${esc(r.name)}</span></td>
      <td class="num">${p ? '$' + p.last.toFixed(2) : '—'}</td><td class="num ${p?.chg1d >= 0 ? 'up' : 'dn'}">${p ? fPct(p.chg1d) : '—'}</td>
      ${scoreCell(s.overall, 'var(--accent)', 1)}${scoreCell(s.merger, 'var(--ma)')}${scoreCell(s.fda, 'var(--fda)')}${scoreCell(s.earnings, 'var(--earn)')}${scoreCell(s.event, 'var(--event)')}
      <td class="sc"><b>${s.sentiment > 0 ? '+' : ''}${s.sentiment}</b>${sentBar(s.sentiment)}</td>
      <td class="num">${e.nextDate ? `${fDate(e.nextDate)} <span class="sub">· ${e.daysTo}d</span>` : '—'}</td><td class="num">${fMoney(r.fund?.mcap)}</td>
      <td class="why" title="${esc(r.thesis[0]?.text || '')}">${esc(r.thesis[0]?.text || '—')}</td></tr>`;
  }).join('') + Array(Math.min(pending, 6)).fill(`<tr class="sk"><td colspan="13"><span></span></td></tr>`).join('')
    || `<tr><td colspan="13" class="empty">${S.tickers.length ? 'Nothing matches these criteria. Loosen a filter or hit Reset.' : 'Pick a universe and run a screen.'}</td></tr>`;
  $('#count').innerHTML = `${rows.length} match${rows.length === 1 ? '' : 'es'} <span class="sub">of ${S.tickers.length} screened${pending ? ` · loading ${pending}` : ''}${failed ? ` · ${failed} unavailable` : ''}</span>`;
  $('#bar i').style.width = S.tickers.length ? (100 * (S.tickers.length - pending)) / S.tickers.length + '%' : '0';
  $('#bar').style.opacity = pending ? 1 : 0;
}

function load(ticker) {
  return api('/api/analyze?ticker=' + encodeURIComponent(ticker)).then(r => (S.res[ticker] = r), e => (S.res[ticker] = { error: e.message }));
}

async function run(list) {
  const gen = ++S.gen;
  S.tickers = [...new Set(list)];
  renderTable();
  const queue = S.tickers.filter(t => !S.res[t] || S.res[t].error);
  const worker = async () => { while (queue.length && gen === S.gen) { await load(queue.shift()); if (gen === S.gen) { renderTable(); refreshViews(); } } };
  await Promise.all([1, 2, 3, 4].map(worker));
  sources();
}

function refreshViews() { if (S.view === 'calendar') renderCalendar(); if (S.view === 'signals') renderSignals(); }
async function sources() {
  const st = await api('/api/status').catch(() => ({})), names = Object.keys(st), bad = names.filter(n => !st[n].ok);
  $('#sources').innerHTML = names.length ? `<span>${bad.length ? bad.length + ' source' + (bad.length > 1 ? 's' : '') + ' down' : 'Live data'}</span>` + names.map(n => `<i class="${st[n].ok ? '' : 'bad'}" data-tip="${esc(n)}: ${st[n].ok ? 'connected' : esc(st[n].error)}"></i>`).join('') : '';
}

// ---------- Charts ----------
function ticks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw), out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(v);
  return out;
}

function priceChart(r) {
  const data = r.chart;
  if (data.length < 20) return '<div class="empty">Price history is unavailable right now.</div>';
  const W = 800, H = 260, L = 6, R = 58, T = 14, B = 24, F = 21, n = data.length, last = data[n - 1][1], sig = r.price?.sigma30 || 0;
  const top = last * Math.exp(sig), bot = last * Math.exp(-sig), ys = data.map(d => d[1]);
  let lo = Math.min(...ys, bot), hi = Math.max(...ys, top);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const x = i => L + (i / (n - 1 + F)) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const line = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d[1]).toFixed(1)}`).join('');
  const grid = ticks(lo, hi, 4).map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#16161b"/><text x="${W - R + 8}" y="${y(v) + 3.5}">${v >= 1000 ? v.toFixed(0) : v.toFixed(v < 10 ? 2 : 0)}</text>`).join('');
  let months = '', prev = '';
  data.forEach((d, i) => { const m = d[0].slice(0, 7); if (m !== prev && i > 8 && +m.slice(5) % 2 === 1) months += `<text x="${x(i)}" y="${H - 6}">${new Date(d[0] + 'T12:00').toLocaleDateString('en-US', { month: 'short' })}</text>`; prev = m; });
  const at = d => { const i = data.findIndex(b => b[0] >= d); return i; };
  const marks = r.markers.map(m => ({ ...m, i: at(m.d) })).filter(m => m.i >= 0);
  const dots = marks.map(m => m.type === 'earn'
    ? `<circle cx="${x(m.i)}" cy="${y(data[m.i][1])}" r="4.5" fill="var(--earn)" stroke="#000" stroke-width="2"/>`
    : `<rect x="${x(m.i) - 4}" y="${y(data[m.i][1]) - 4}" width="8" height="8" transform="rotate(45 ${x(m.i)} ${y(data[m.i][1])})" fill="var(--ma)" stroke="#000" stroke-width="2"/>`).join('');
  const xe = x(n - 1 + F), x0 = x(n - 1);
  const cone = sig ? `<path d="M${x0},${y(last)}L${xe},${y(top)}L${xe},${y(bot)}Z" fill="rgba(255,255,255,.07)"/><path d="M${x0},${y(last)}L${xe},${y(top)}M${x0},${y(last)}L${xe},${y(bot)}" stroke="#6c6c78" stroke-dasharray="3 3" fill="none"/><text class="val" x="${xe + 6}" y="${y(top) + 4}">${fPct(Math.exp(sig) - 1, 0)}</text><text class="val" x="${xe + 6}" y="${y(bot) + 4}">${fPct(Math.exp(-sig) - 1, 0)}</text>` : '';
  const dt = r.earnings.daysTo, es = dt != null && dt <= 30 ? Math.round((dt * 5) / 7) : null;
  const earn = es != null ? `<line x1="${x(n - 1 + es)}" x2="${x(n - 1 + es)}" y1="${T}" y2="${H - B}" stroke="var(--earn)" stroke-dasharray="2 3"/><text x="${x(n - 1 + es) - 4}" y="${T + 2}" text-anchor="end">Earnings</text>` : '';
  return `<svg class="chart" id="pc" viewBox="0 0 ${W} ${H}" data-geo='${JSON.stringify({ W, L, R, F, n })}'>
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8ff3e" stop-opacity=".2"/><stop offset="1" stop-color="#c8ff3e" stop-opacity="0"/></linearGradient></defs>
    ${grid}${months}<path d="${line}L${x0},${H - B}L${L},${H - B}Z" fill="url(#ag)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${cone}${earn}${dots}<g id="pch" style="display:none"><line y1="${T}" y2="${H - B}" stroke="#3a3a44"/><circle r="4.5" fill="var(--accent)" stroke="#000" stroke-width="2"/></g>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
}

function bindChart(r) {
  const svg = $('#pc'); if (!svg) return;
  const g = JSON.parse(svg.dataset.geo), data = r.chart, hover = $('#pch'), tip = $('#tip');
  const labels = {}; r.markers.forEach(m => { const i = data.findIndex(b => b[0] >= m.d); if (i >= 0) (labels[i] ||= []).push(m.label); });
  svg.addEventListener('mousemove', e => {
    const box = svg.getBoundingClientRect(), vx = ((e.clientX - box.left) / box.width) * g.W;
    const i = Math.max(0, Math.min(g.n - 1, Math.round(((vx - g.L) / (g.W - g.L - g.R)) * (g.n - 1 + g.F))));
    const near = [i, i - 1, i + 1, i - 2, i + 2].find(k => labels[k]);
    const j = near ?? i, cx = g.L + (j / (g.n - 1 + g.F)) * (g.W - g.L - g.R);
    hover.style.display = ''; hover.firstElementChild.setAttribute('x1', cx); hover.firstElementChild.setAttribute('x2', cx);
    hover.lastElementChild.setAttribute('cx', cx); hover.lastElementChild.setAttribute('cy', yOf(svg, data, j));
    showTip(`<b>$${data[j][1].toFixed(2)}</b> · ${fDate(data[j][0], 1)}${labels[j] ? '<br>' + labels[j].map(esc).join('<br>') : ''}`, e);
  });
  svg.addEventListener('mouseleave', () => { hover.style.display = 'none'; tip.classList.remove('on'); });
}
// y position of a data point, read back from the rendered line path so the hover dot always sits on the line
function yOf(svg, data, j) { const seg = svg.querySelector('path[stroke="var(--accent)"]').getAttribute('d').split(/[ML]/).filter(Boolean)[j]; return seg ? seg.split(',')[1] : 0; }

const bar = (x, y, w, h, up, fill, extra = '') => { const r = Math.min(4, h, w / 2); return up ? `<path d="M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z" fill="${fill}" ${extra}/>` : `<path d="M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z" fill="${fill}" ${extra}/>`; };
const qLabel = d => new Date(d + 'T12:00').toLocaleDateString('en-US', { month: 'short' }) + " '" + d.slice(2, 4);

function reactionBars(hist) {
  if (!hist.length) return '<div class="empty">No past earnings reactions on record.</div>';
  const W = 380, H = 150, slot = (W - 8) / hist.length, bw = Math.min(26, slot - 8), mid = 66, max = Math.max(0.02, ...hist.map(h => Math.abs(h.move))), sc = 44 / max;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#2b2b33"/>` + hist.map((h, i) => {
    const cx = 4 + (i + 0.5) * slot, ht = Math.max(2, Math.abs(h.move) * sc), up = h.move >= 0;
    return `<g data-tip="${esc(fDate(h.date, 1))} · ${fPct(h.move)} across the release">${bar(cx - bw / 2, up ? mid - ht : mid, bw, ht, up, up ? 'var(--up)' : 'var(--down)')}<text class="val" x="${cx}" y="${up ? mid - ht - 5 : mid + ht + 13}" text-anchor="middle">${fPct(h.move, 0)}</text><text x="${cx}" y="${H - 4}" text-anchor="middle">${qLabel(h.date)}</text></g>`;
  }).join('') + '</svg>';
}

function epsBars(e) {
  const q = e.epsQ.slice(-7);
  if (q.length < 2) return '<div class="empty">Quarterly EPS history is unavailable.</div>';
  const all = q.map(x => ({ ...x })).concat(e.epsForecast != null ? [{ val: e.epsForecast, f: 1 }] : []);
  const W = 380, H = 150, slot = (W - 8) / all.length, bw = Math.min(26, slot - 8), max = Math.max(0.01, ...all.map(x => x.val)), min = Math.min(0, ...all.map(x => x.val));
  const base = 22 + (max / (max - min)) * 96, sc = 96 / (max - min);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#2b2b33"/>` + all.map((x, i) => {
    const cx = 4 + (i + 0.5) * slot, ht = Math.max(2, Math.abs(x.val) * sc), up = x.val >= 0, show = x.f || i === q.length - 1 || i === 0;
    return `<g data-tip="${x.f ? 'Model estimate for next quarter' : 'Quarter ending ' + esc(fDate(x.end, 1))} · EPS $${x.val.toFixed(2)}">${bar(cx - bw / 2 + (x.f ? 0.75 : 0), up ? base - ht : base, bw - (x.f ? 1.5 : 0), ht, up, x.f ? 'transparent' : 'var(--earn)', x.f ? 'stroke="var(--earn)" stroke-width="1.5" stroke-dasharray="3 3"' : '')}${show ? `<text class="val" x="${cx}" y="${up ? base - ht - 5 : base + ht + 13}" text-anchor="middle">${x.val.toFixed(2)}</text>` : ''}<text x="${cx}" y="${H - 4}" text-anchor="middle">${x.f ? 'Next' : qLabel(x.end)}</text></g>`;
  }).join('') + '</svg>';
}

const ring = v => `<div class="ring"><svg viewBox="0 0 112 112" width="112" height="112"><circle cx="56" cy="56" r="49" fill="none" stroke="#1b1b20" stroke-width="7"/><circle cx="56" cy="56" r="49" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(v / 100) * 307.9} 307.9"/></svg><b>${v}</b></div>`;

// ---------- Detail ----------
const evi = list => (list.length ? `<ul class="evi">${list.map(e => `<li><span class="w">+${e.w}</span><span>${e.url ? `<a href="${href(e.url)}" target="_blank" rel="noopener">${esc(e.text)} ↗</a>` : esc(e.text)}</span><span class="d">${e.date ? fDate(e.date) : ''}</span></li>`).join('')}</ul>` : '<div class="empty">No signals firing.</div>');

function renderDetail(r) {
  const p = r.price, f = r.fund || {}, e = r.earnings, s = r.scores, nw = r.news;
  const tile = k => { const v = s[k], [n, col] = CATS[k]; return `<div class="tile"><span class="lab"><i style="background:${col}"></i>${n}</span><b>${v ?? '—'}</b><em>${esc(v == null ? 'Not a drug developer' : k === 'earnings' ? e.leanLabel : r[k].level)}</em><div class="meter"><i style="width:${v || 0}%;background:${col}"></i></div></div>`; };
  const stat = (n, v) => `<div><span>${n}</span><b>${v}</b></div>`;
  $('#drawer').innerHTML = `
  <div class="dh"><div><div class="tk">${esc(r.ticker)}<button class="star${S.watch.has(r.ticker) ? ' on' : ''}" data-star="${esc(r.ticker)}" title="Watchlist">★</button></div><div class="nm">${esc(r.name)}</div><div class="sub">${esc([r.industry, r.exchange, r.city].filter(Boolean).join(' · '))}</div></div>
    <div class="px">${p ? `<b>$${p.last.toFixed(2)}</b><span class="${p.chg1d >= 0 ? 'up' : 'dn'}">${fPct(p.chg1d, 2)} today</span>` : '<span class="sub">Price unavailable</span>'}</div><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="card hero">${ring(s.overall)}<div><div class="eyebrow">Catalyst score · led by ${esc(r.driver)}</div><ul class="thesis">${r.thesis.map(t => `<li><i style="background:${CAT_COLOR[t.cat]}"></i><span>${esc(t.text)}</span></li>`).join('') || '<li>No notable signals right now.</li>'}</ul></div></div>
  <div class="tiles">${Object.keys(CATS).map(tile).join('')}<div class="tile"><span class="lab">News sentiment</span><b>${nw.score > 0 ? '+' : ''}${nw.score}</b><em>${nw.label} · ${nw.count} headlines</em>${sentBar(nw.score)}</div></div>

// ---------- Calendar & signal tape ----------
function renderCalendar() {
  const ev = [];
  for (const r of ok()) {
    const e = r.earnings;
    if (e.nextDate) ev.push({ d: e.nextDate, days: e.daysTo, t: r.ticker, cat: 'Earnings', text: `Earnings, estimated date${e.expectedMove ? ` · typical move ±${(e.expectedMove * 100).toFixed(1)}%` : ''} · ${e.leanLabel.toLowerCase()}` });
    for (const c of r.fda.catalysts || []) if (c.days >= 0) ev.push({ d: c.date, days: c.days, t: r.ticker, cat: 'FDA', text: `${c.kind}: ${c.label} · ${c.phase === 'filed' ? 'under FDA review' : 'Phase ' + c.phase} · approval odds about ${Math.round(c.odds * 100)}%` });
  }
  ev.sort((a, b) => (a.d < b.d ? -1 : 1));
  const groups = [['This week', 7], ['Next 30 days', 30], ['Next 90 days', 90], ['Later', 1e9]]; let lo = -1;
  $('#calendar').innerHTML = ev.length ? groups.map(([name, hi]) => {
    const g = ev.filter(x => x.days > lo && x.days <= hi); lo = hi;
    return g.length ? `<h2>${name}</h2><div class="card">${g.map(x => `<div class="row"><span class="d">${fDate(x.d)} · ${x.days}d</span><b class="t" data-open="${esc(x.t)}">${esc(x.t)}</b><span><span class="tag"><i class="dot" style="background:${CAT_COLOR[x.cat]}"></i>${x.cat}</span></span><span class="x">${esc(x.text)}</span></div>`).join('')}</div>` : '';
  }).join('') : '<div class="empty">Run a screen first — upcoming earnings and FDA catalysts for those companies will be laid out here.</div>';
}

function renderSignals() {
  const rows = [];
  for (const r of ok()) for (const k of Object.keys(CATS)) for (const e of r[k].evidence || []) if (e.date) rows.push({ ...e, t: r.ticker });
  rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.w - a.w));
  const shown = rows.filter(x => S.tape === 'All' || x.cat === S.tape).slice(0, 150);
  $('#signals').innerHTML = `<div class="chips" style="margin:4px">${['All', 'M&A', 'FDA', 'Earnings', 'Event'].map(c => `<button class="chip${S.tape === c ? ' on' : ''}" data-tape="${c}">${c}</button>`).join('')}</div>`
    + (shown.length ? `<div class="card">${shown.map(x => `<div class="row"><span class="d">${fDate(x.date)}</span><b class="t" data-open="${esc(x.t)}">${esc(x.t)}</b><span><span class="tag"><i class="dot" style="background:${CAT_COLOR[x.cat]}"></i>${x.cat}</span></span><span class="x">${x.url ? `<a href="${href(x.url)}" target="_blank" rel="noopener">${esc(x.text)} ↗</a>` : esc(x.text)}</span></div>`).join('')}</div>` : '<div class="empty">Run a screen first — dated signals from every company you screen stream in here, newest first.</div>');
}

// ---------- Direction forecast & options ----------
function forecastCard(fc, title = 'Direction forecast') {
  if (!fc) return '';
  const down = fc.verdict === 'Down', p = down ? 1 - fc.pUp : fc.pUp, stat = (n, v) => `<div><span>${n}</span><b>${v}</b></div>`;
  return `<div class="card"><h3>${title}<span class="tag">Next ${fc.horizon} trading days</span></h3>
    <div class="fch"><div class="call ${fc.verdict === 'Up' ? 'up' : down ? 'dn' : ''}">${fc.verdict === 'Up' ? '▲ Up' : down ? '▼ Down' : '◆ No clear edge'}</div>
      <div class="sub" style="font-size:13px"><b style="color:var(--ink);font-size:18px">${Math.round(p * 100)}%</b> modelled chance the price is ${down ? 'lower' : 'higher'} in ${fc.horizon} trading days</div></div>
    <div class="stats" style="margin:14px 0">${stat('Expected move', fPct(Math.exp(fc.expRet) - 1))}${stat('Likely range', '$' + fc.low.toFixed(2) + ' – $' + fc.high.toFixed(2))}${stat('Typical ' + fc.horizon + '-day swing', '±' + (fc.sigma * 100).toFixed(1) + '%')}${stat('Signal track record', fc.hitRate != null ? Math.round(fc.hitRate * 100) + '% right · ' + fc.samples + ' calls' : 'Too little history')}</div>
    ${fc.factors.map(f => `<div class="fac"><span>${esc(f.name)}</span><span class="sub">${esc(f.note)}</span>${sentBar(Math.round(f.v * 100))}</div>`).join('')}
    <div class="note">Bars right of center push the forecast up, left push it down. Technicals and news tilt the odds away from the stock's own baseline; the tilt is scaled by how often this same signal was right on this stock over the past year. Short-term direction is close to a coin flip — treat this as a lean, not a promise.</div></div>`;
}

function chainCard(d) {
  const ch = d.chain;
  if (d.needsKey) return `<div class="card"><h3>Option chain</h3><div class="empty">Option chains need a free data key. Add a Tradier or Alpha Vantage key and every strike loads here, marked green or red.<br><br><button class="primary" style="width:auto;padding:9px 20px;margin:0" data-settings>Add a free key</button></div></div>`;
  if (!ch) return '<div class="card"><h3>Option chain</h3><div class="empty">Not enough price history to model this symbol.</div></div>';
  if (ch.error) return `<div class="card"><h3>Option chain</h3><div class="empty">${esc(ch.error)}.<br><br><button class="ghost" data-settings>Check the key in Settings</button></div></div>`;
  const cell = o => { const c = o.up ? 'g' : 'r', pc = o.change == null ? '—' : fPct(Math.max(-0.99, Math.min(9.99, o.change)), 0); return [`<td class="${c} o"><i>${o.up ? '▲' : '▼'}</i> ${pc}</td>`, `<td class="${c}">${o.mid != null ? o.mid.toFixed(2) : '—'}</td>`, `<td class="${c}">${o.iv ? Math.round(o.iv * 100) + '%' : '—'}</td>`, `<td class="${c}">${o.delta != null ? o.delta.toFixed(2) : '—'}</td>`]; };
  const blank = '<td class="sub">—</td>'.repeat(4);
  let spot = false, body = '';
  for (const r of ch.rows) {
    if (!spot && r.strike > d.price) { spot = true; body += `<tr class="spot"><td colspan="9">$${d.price.toFixed(2)} · current price</td></tr>`; }
    body += `<tr>${r.call ? cell(r.call).join('') : blank}<td class="k">${r.strike % 1 ? r.strike.toFixed(2) : r.strike}</td>${r.put ? cell(r.put).reverse().join('') : blank}</tr>`;
  }
  const count = side => { const a = ch.rows.filter(r => r[side]); return `${a.filter(r => r[side].up).length} green · ${a.filter(r => !r[side].up).length} red`; };
  return `<div class="card"><h3>Option chain · ${ch.rows.length} strikes<span class="key"><span>Calls: ${count('call')}</span><span>Puts: ${count('put')}</span></span></h3>
    <div class="exps">${ch.expirations.map(x => `<button class="chip${x === ch.exp ? ' on' : ''}" data-exp="${x}">${fDate(x, 1)}</button>`).join('')}</div>
    <div class="chainwrap"><table class="chain"><thead><tr><th>Call outlook</th><th>Price</th><th>IV</th><th>Delta</th><th class="k">Strike</th><th>Delta</th><th>IV</th><th>Price</th><th>Put outlook</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="note"><b style="color:var(--up)">Green ▲</b> = the model expects that contract to be worth more after ${ch.holdDays} trading day${ch.holdDays === 1 ? '' : 's'}; <b style="color:var(--down)">red ▼</b> = worth less. The percentage is the expected change in the option's value: it is priced across the range of places the forecast says the stock could land, then compared with today, so time decay counts against every contract. Expected volatility blends what the option market implies with what the stock has actually been doing. Expires in ${ch.daysToExpiry} days · at-the-money implied volatility ${Math.round(ch.atmIv * 100)}% · data via ${ch.provider === 'tradier' ? 'Tradier' : 'Alpha Vantage (prior session)'}.</div></div>`;
}

function renderOptions() {
  const o = S.opt || {}, d = o.data;
  $('#options').innerHTML = `<form id="optform"><input name="symbol" placeholder="Symbol, e.g. QQQ" value="${esc(o.symbol || '')}" autocomplete="off" spellcheck="false" required><button type="submit">Predict</button>${['QQQ', 'SPY', 'NVDA', 'AAPL', 'TSLA', 'AMD'].map(s => `<button type="button" class="chip" data-optsym="${s}">${s}</button>`).join('')}</form>`
    + (o.loading ? `<div class="empty">Running the forecast for ${esc(o.symbol)}…</div>`
      : o.error ? `<div class="empty">${esc(o.error)}.</div>`
      : !d ? '<div class="empty">Pick any stock or ETF. You get an up / down forecast for the price, and every option strike marked green or red.</div>'
      : `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:16px"><div><div style="font-size:24px;font-weight:700">${esc(d.symbol)}</div><div class="sub">${esc(d.name)}</div></div><div style="text-align:right"><b style="font-size:22px">$${d.price.toFixed(2)}</b><div class="${d.chg1d >= 0 ? 'up' : 'dn'}">${fPct(d.chg1d, 2)} today</div></div></div>`
        + (forecastCard(d.forecast, 'Price forecast') || '<div class="card"><div class="empty">This symbol needs about a year of price history before a forecast can be made.</div></div>') + chainCard(d));
  const w = $('.chainwrap'), s = $('.chain .spot');
  if (w && s) w.scrollTop = s.offsetTop - w.clientHeight / 2;
}

async function loadOptions(symbol, exp) {
  symbol = symbol.trim().toUpperCase();
  S.opt = { symbol, loading: true, data: exp ? S.opt?.data : null };
  if (!exp) renderOptions();
  try { S.opt = { symbol, data: await api(`/api/predict?symbol=${encodeURIComponent(symbol)}${exp ? '&exp=' + exp : ''}`) }; } catch (e) { S.opt = { symbol, error: e.message }; }
  if (S.view === 'options') renderOptions();
}

function initMap() {
  map = L.map('map', { preferCanvas: true, zoomSnap: 0.5, minZoom: 2, maxZoom: 11, maxBounds: [[-85, -190], [85, 190]] }).setView([39, -96], 4.5);
  map.attributionControl.addAttribution('Map: Natural Earth, US Census · Aircraft: adsb.lol');
  // Self-contained vector basemap (no tile server): countries plus US state lines, drawn beneath the aircraft.
  map.createPane('base').style.zIndex = 250;
  const base = L.canvas({ pane: 'base' });
  Promise.all(['countries-110m', 'states-10m'].map(f => fetch(`vendor/${f}.json`).then(r => r.json()))).then(([world, us]) => {
    L.geoJSON(topojson.feature(world, world.objects.countries), { pane: 'base', renderer: base, interactive: false, style: { color: '#2e2e37', weight: 1, fillColor: '#0e0e12', fillOpacity: 1 } }).addTo(map);
    L.geoJSON(topojson.mesh(us, us.objects.states, (a, b) => a !== b), { pane: 'base', renderer: base, interactive: false, style: { color: '#26262e', weight: 1, fill: false } }).addTo(map);
  });
  jetLayer = L.layerGroup().addTo(map); hqLayer = L.layerGroup().addTo(map);
  map.on('popupopen', e => e.popup.getElement().querySelector('[data-tagreg]')?.addEventListener('click', ev => { const f = $('#tagform'); f.reg.value = ev.target.dataset.tagreg; f.ticker.focus(); map.closePopup(); }));
}

async function loadJets() {
  clearTimeout(jetTimer);
  let d; try { d = await api('/api/jets'); } catch { return; }
  jetLayer.clearLayers(); hqLayer.clearLayers();
  const nearHex = new Set(Object.values(d.near).flat().map(j => j.hex));
  for (const a of d.jets) {
    const tagged = d.fleet[a.reg], hot = tagged || nearHex.has(a.hex);
    const pop = `<b>${esc(a.reg || a.hex)}</b> · ${esc(a.type)}<br>${a.ground ? 'On the ground' : `${(a.alt || 0).toLocaleString()} ft · ${Math.round(a.gs || 0)} kt`}${tagged ? `<br>Tagged to <b>${esc(tagged.ticker)}</b>` : ''}<br>${faa(a.reg)}${a.reg && !tagged ? ` &nbsp;<a href="#" data-tagreg="${esc(a.reg)}">Tag to a company</a>` : ''}`;
    (hot ? L.marker([a.lat, a.lon], { icon: plane(a, tagged), zIndexOffset: 500 }) : L.circleMarker([a.lat, a.lon], { radius: 2.4, stroke: false, fillColor: '#9a9aa6', fillOpacity: 0.8 })).bindPopup(pop).addTo(jetLayer);
  }
  for (const [t, h] of Object.entries(d.hqs)) {
    const n = (d.near[t] || []).length;
    L.marker([h.lat, h.lon], { icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<span class="hq${n ? ' hot' : ''}">${esc(t)}${n ? `<b>${n}</b>` : ''}</span>` }) }).bindPopup(`<b>${esc(t)}</b> · ${esc(h.name)}<br>${esc(h.city)}<br>${n} business jet${n === 1 ? '' : 's'} on the ground within ${d.radiusKm} km`).addTo(hqLayer);
  }
  const near = Object.entries(d.near).sort((a, b) => b[1].length - a[1].length), tagged = Object.entries(d.fleet), nNear = nearHex.size;
  $('#jetside').innerHTML = `
    <div class="card"><div class="kpis"><div><b>${d.jets.length.toLocaleString()}</b><span>business jets tracked live</span></div><div><b>${nNear}</b><span>parked near your HQs</span></div><div><b>${tagged.length}</b><span>jets you've tagged</span></div></div>
      <div class="sub">${d.refreshing ? `Scanning aircraft feeds… ${Math.round(d.progress * 100)}%` : d.paused ? 'Aircraft feed is busy — resuming in a few minutes' : d.at ? 'Updated ' + new Date(d.at).toLocaleTimeString() : 'Starting…'} · ${Object.keys(d.hqs).length} headquarters on the map</div>
      <div class="key" style="margin-top:10px"><span><i style="background:var(--accent)"></i>Tagged jet</span><span><i style="background:var(--earn)"></i>Parked near an HQ</span><span><i style="background:#9a9aa6"></i>Other jets</span></div></div>
    <div class="card"><h3>Cross-company visits</h3>${d.visits.length ? d.visits.map(v => `<div class="jl"><span><b>${esc(v.reg)}</b> (${esc(v.owner)}) near <b class="t" data-open="${esc(v.hq)}" style="cursor:pointer">${esc(v.hq)}</b> HQ</span><small>${ago(v.time)} · ${v.km} km</small></div>`).join('') : `<div class="sub">When a jet you've tagged to one company lands within ${d.radiusKm} km of another tracked company's headquarters, it is logged here and added to both companies' M&A scores.</div>`}</div>
    <div class="card"><h3>Parked near headquarters</h3>${near.length ? near.map(([t, list]) => `<div class="jl"><span><b class="t" data-open="${esc(t)}" style="cursor:pointer">${esc(t)}</b> <small>${esc(d.hqs[t]?.city || '')}</small><br><small>${list.slice(0, 6).map(j => esc(j.reg || j.hex) + ' ' + esc(j.type)).join(' · ')}${list.length > 6 ? ' …' : ''}</small></span><b>${list.length}</b></div>`).join('') : `<div class="sub">${Object.keys(d.hqs).length ? 'No large business jets are on the ground near tracked headquarters right now.' : 'Run a screen first — each company you analyze is placed on the map at its headquarters.'}</div>`}</div>
    <div class="card"><h3>Tag a jet to a company</h3><form id="tagform"><input name="reg" placeholder="Tail, e.g. N123AB" required><input name="ticker" placeholder="Ticker" required><button>Tag</button></form>
      ${tagged.map(([reg, v]) => `<div class="jl"><span><b>${esc(reg)}</b> → ${esc(v.ticker)}</span><button class="ghost" data-untag="${esc(reg)}">Remove</button></div>`).join('')}
      <div class="note">Aircraft registrations are public, but no free feed links tails to listed companies. Click any jet, use "Look up owner" to check the FAA registry, then tag it — from then on its landings are watched automatically.</div></div>`;
  if (S.view === 'jets') jetTimer = setTimeout(loadJets, d.refreshing ? 4000 : 30000);
}

// ---------- Wiring ----------
function showTip(html, e) { const t = $('#tip'); t.innerHTML = html; t.classList.add('on'); const w = t.offsetWidth, h = t.offsetHeight; t.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px'; t.style.top = Math.max(8, e.clientY - h - 12) + 'px'; }
document.addEventListener('mousemove', e => { const el = e.target.closest?.('[data-tip]'); if (el) showTip(esc(el.dataset.tip), e); else if (!e.target.closest?.('#pc')) $('#tip').classList.remove('on'); });

function show(view) {
  S.view = view;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
  if (view === 'calendar') renderCalendar();
  if (view === 'signals') renderSignals();
  if (view === 'options') renderOptions();
  if (view === 'jets') { if (!map) initMap(); map.invalidateSize(); loadJets(); } else clearTimeout(jetTimer);
}

document.addEventListener('click', e => {
  const t = e.target, hit = s => t.closest(s);
  let el;
  if ((el = hit('[data-star]'))) { const k = el.dataset.star; S.watch.has(k) ? S.watch.delete(k) : S.watch.add(k); store('watch', [...S.watch]); document.querySelectorAll(`[data-star="${CSS.escape(k)}"]`).forEach(b => b.classList.toggle('on', S.watch.has(k))); if (S.crit.starred) renderTable(); return; }
  if (hit('[data-close]')) return closeDetail();
  if ((el = hit('#tabs [data-v]'))) return show(el.dataset.v);
  if ((el = hit('[data-sort]'))) { const k = el.dataset.sort; S.sort = [k, S.sort[0] === k ? -S.sort[1] : k === 'ticker' || k === 'next' ? 1 : -1]; return renderTable(); }
  if ((el = hit('[data-screen]'))) { S.crit = { ...({ ...SCREENS, ...S.saved }[el.dataset.screen]) }; store('crit', S.crit); renderCrit(); return renderTable(); }
  if ((el = hit('[data-tape]'))) { S.tape = el.dataset.tape; return renderSignals(); }
  if ((el = hit('[data-untag]'))) return api('/api/fleet?reg=' + encodeURIComponent(el.dataset.untag), { method: 'DELETE' }).then(loadJets);
  if (hit('[data-settings]')) return openSettings();
  if ((el = hit('[data-optsym]'))) return loadOptions(el.dataset.optsym);
  if ((el = hit('[data-exp]'))) return loadOptions(S.opt.symbol, el.dataset.exp);
  if ((el = hit('[data-clear]'))) return saveSettings({ [el.dataset.clear]: '' });
  if ((el = hit('[data-test]'))) {
    const out = $('#res-' + el.dataset.test); out.textContent = 'Testing…'; out.className = 'res sub';
    return api('/api/settings/test', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider: el.dataset.test }) })
      .then(r => { out.textContent = r.ok ? '✓ Connected — working' : '✕ ' + r.error + (el.form && [...el.form.elements].some(i => i.type !== 'checkbox' && i.value && i.name !== 'secContact') ? ' (save your changes first)' : ''); out.className = 'res ' + (r.ok ? 'up' : 'dn'); });
  }
  if ((el = hit('[data-open]')) && !hit('a')) return openDetail(el.dataset.open);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'search') { const t = $('#q').value.trim().toUpperCase(); if (t) { openDetail(t); $('#q').value = ''; $('#q').blur(); } }
  if (e.target.id === 'optform') loadOptions(e.target.symbol.value);
  if (e.target.id === 'setform') { const f = e.target, patch = { tradierLive: f.tradierLive.checked, secContact: f.secContact.value }; for (const k of ['tradier', 'alphavantage', 'finnhub']) if (f[k].value.trim()) patch[k] = f[k].value; saveSettings(patch); }
  if (e.target.id === 'tagform') { const f = e.target; api('/api/fleet', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reg: f.reg.value, ticker: f.ticker.value }) }).then(loadJets, err => alert(err.message)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); } });
$('#reset').onclick = () => { S.crit = {}; store('crit', S.crit); renderCrit(); renderTable(); };
$('#save').onclick = () => { const n = prompt('Name this screen'); if (n?.trim()) { S.saved[n.trim()] = { ...S.crit }; store('screens', S.saved); renderCrit(); } };
$('#run').onclick = () => {
  const custom = $('#custom').value.toUpperCase().split(/[^A-Z0-9.-]+/).filter(Boolean);
  store('uni', $('#uni').value); store('custom', $('#custom').value);
  run(custom.length ? custom : S.universes[$('#uni').value] || []);
};
$('#csv').onclick = () => {
  const rows = ok().filter(passes).map(r => [r.ticker, r.name, r.price?.last?.toFixed(2), r.scores.overall, r.scores.merger, r.scores.fda, r.scores.earnings, r.scores.event, r.scores.sentiment, r.earnings.nextDate, r.fund?.mcap ? Math.round(r.fund.mcap) : '', r.thesis[0]?.text]);
  const csv = [['Ticker', 'Name', 'Price', 'Catalyst', 'M&A', 'FDA', 'Earnings', 'Event', 'Sentiment', 'Next earnings (est.)', 'Market cap', 'Top signal'], ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'catalyst-screen.csv'; a.click();
};

(async () => {
  renderCrit(); renderTable();
  S.universes = await api('/api/universes');
  $('#uni').innerHTML = Object.keys(S.universes).map(n => `<option>${esc(n)}</option>`).join('');
  $('#uni').value = S.universes[store('uni')] ? store('uni') : Object.keys(S.universes)[0];
  $('#custom').value = store('custom') || '';
  $('#run').click();
})();
</script>
</body>
</html>
