<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviary</title>
<style>
  :root {
    --bg: #f6f4ee; --panel: #ece9df; --card: #ffffff; --ink: #1f2a24; --muted: #6b756f;
    --line: #d9d5c8; --accent: #2f6b4f; --accent-ink: #ffffff; --code-bg: #1b211e; --code-ink: #e4eae6;
    --danger: #a4432f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141815; --panel: #1a201c; --card: #1f2622; --ink: #e6ebe7; --muted: #94a09a;
      --line: #2c3530; --accent: #6fbf97; --accent-ink: #10231a; --code-bg: #0d110f; --code-ink: #dbe5df;
      --danger: #e08a76;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  aside { width: 250px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; padding: 16px 12px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; padding: 0 6px; }
  .brand svg { width: 22px; height: 22px; color: var(--accent); }
  .new { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
         padding: 9px 12px; font-weight: 600; }
  #chats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .chat-row { display: flex; align-items: center; border-radius: 8px; }
  .chat-row.active, .chat-row:hover { background: var(--line); }
  .chat-row button { background: none; border: 0; padding: 7px 8px; text-align: left; }
  .chat-row .open { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-row .del { color: var(--muted); visibility: hidden; }
  .chat-row:hover .del, .chat-row .del:focus-visible { visibility: visible; }
  .private { font-size: 12px; color: var(--muted); padding: 0 6px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); }
  header label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  select, input[type=number] { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
                               padding: 6px 8px; color: var(--ink); }
  input[type=number] { width: 76px; }
  input[type=range] { accent-color: var(--accent); width: 110px; }
  #card { font-size: 13px; color: var(--muted); padding: 8px 20px; border-bottom: 1px solid var(--line); }

  #thread { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .empty { text-align: center; margin-top: 12vh; }
  .empty h1 { font-size: 26px; margin: 0 0 6px; }
  .empty p { color: var(--muted); margin: 0 0 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips button { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; }
  .chips button:hover { border-color: var(--accent); }
  .user { align-self: flex-end; max-width: 85%; background: var(--panel); border: 1px solid var(--line);
          border-radius: 14px 14px 4px 14px; padding: 9px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .reply .who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .reply .who b { color: var(--accent); text-transform: capitalize; }
  .reply .who button { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 6px;
                       padding: 2px 9px; font-size: 12px; color: var(--muted); }
  pre { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 14px 16px;
        overflow-x: auto; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 48px; }
  .error { color: var(--danger); }

  footer { padding: 12px 20px 16px; border-top: 1px solid var(--line); }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
              background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; outline: 0; background: none; resize: none; max-height: 180px; padding: 6px 0; }
  #send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 600; }
  #send:disabled { opacity: .45; cursor: default; }
  #send.stop { background: var(--danger); color: #fff; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
  @media (max-width: 720px) { aside { display: none; } }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20c6 0 10-3 12-8l6-3-5-1c-1-3-5-4-8-2s-4 6-2 9"/><circle cx="12.5" cy="8.5" r=".6" fill="currentColor"/></svg>
    Aviary
  </div>
  <button class="new" id="new">+ New chat</button>
  <div id="chats"></div>
  <div class="private">Runs entirely on this computer. No API, no account, nothing leaves the machine.</div>
</aside>
<main>
  <header>
    <label>Model <select id="model"></select></label>
    <label>Creativity <input type="range" id="temp" min="0" max="1.5" step="0.1" value="0.6"><span id="tempv">0.6</span></label>
    <label>Max length <input type="number" id="maxtok" min="16" max="1024" step="16" value="200"></label>
  </header>
  <div id="card"></div>
  <div id="thread"><div class="wrap" id="wrap"></div></div>
  <footer>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Describe a Python function…" aria-label="Message"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="hint">Each message is answered on its own; these models don't remember earlier messages, and small ones make mistakes.</div>
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const SAMPLES = ["Return the sum of a list of numbers.", "Read a file and return its lines.", "Return True if the string is a palindrome."];

let models = [];
let chats = JSON.parse(localStorage.getItem("aviary.chats") || "[]");
let currentId = null;
let controller = null;

const current = () => chats.find((c) => c.id === currentId);
const save = () => localStorage.setItem("aviary.chats", JSON.stringify(chats.slice(0, 100)));
const fmtParams = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : Math.round(n / 1e3) + "K";

function renderChats() {
  const box = $("chats");
  box.replaceChildren();
  for (const c of chats) {
    const row = el("div", "chat-row" + (c.id === currentId ? " active" : ""));
    const open = el("button", "open", c.title);
    open.onclick = () => { currentId = c.id; renderChats(); renderThread(); };
    const del = el("button", "del", "✕");
    del.title = "Delete chat";
    del.onclick = () => {
      chats = chats.filter((x) => x.id !== c.id);
      if (currentId === c.id) currentId = null;
      save(); renderChats(); renderThread();
    };
    row.append(open, del);
    box.append(row);
  }
}

function replyNode(m) {
  const node = el("div", "reply");
  const who = el("div", "who");
  const stats = el("span", "", m.stats || "");
  const copy = el("button", "", "Copy");
  copy.onclick = async () => { await navigator.clipboard.writeText(m.text); copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); };
  who.append(el("b", "", m.model), stats, copy);
  const pre = el("pre", m.error ? "error" : "", m.text);
  node.append(who, pre);
  return { node, pre, stats };
}

function renderThread() {
  const wrap = $("wrap");
  wrap.replaceChildren();
  const chat = current();
  if (!chat || !chat.messages.length) {
    const empty = el("div", "empty");
    empty.append(el("h1", "", "Ask a bird to write some Python"), el("p", "", "Models you built and trained yourself, running on your own machine."));
    const chips = el("div", "chips");
    for (const s of SAMPLES) { const b = el("button", "", s); b.onclick = () => { $("input").value = s; $("input").focus(); }; chips.append(b); }
    empty.append(chips);
    wrap.append(empty);
    return;
  }
  for (const m of chat.messages) wrap.append(m.role === "user" ? el("div", "user", m.text) : replyNode(m).node);
  $("thread").scrollTop = $("thread").scrollHeight;
}

function renderCard() {
  const m = models.find((x) => x.name === $("model").value);
  if (!m) { $("card").textContent = "No model is trained yet. Run: python train.py wren"; return; }
  const t = m.meta;
  $("card").textContent = `${m.name[0].toUpperCase() + m.name.slice(1)} · ${fmtParams(m.params)} parameters · reads ${m.context} tokens · ` +
    (t ? `trained ${t.minutes} min on ${t.device} (${t.steps.toLocaleString()} steps, loss ${t.val_loss})` : "not trained yet") + ` · ${m.blurb}`;
}

async function loadModels() {
  const res = await fetch("/api/models");
  models = (await res.json()).models;
  const sel = $("model");
  const keep = sel.value || localStorage.getItem("aviary.model");
  sel.replaceChildren();
  for (const m of models) {
    const o = el("option", "", `${m.name[0].toUpperCase() + m.name.slice(1)} · ${fmtParams(m.params)}${m.trained ? "" : " (not trained)"}`);
    o.value = m.name; o.disabled = !m.trained;
    sel.append(o);
  }
  const trained = models.filter((m) => m.trained).map((m) => m.name);
  sel.value = trained.includes(keep) ? keep : (trained[0] || "");
  renderCard();
}

async function send(text) {
  const model = $("model").value;
  if (!model) return;
  let chat = current();
  if (!chat) {
    chat = { id: Date.now().toString(36), title: text.slice(0, 40), messages: [] };
    chats.unshift(chat); currentId = chat.id;
  }
  const reply = { role: "model", model, text: "", stats: "" };
  chat.messages.push({ role: "user", text }, reply);
  renderChats(); renderThread();
  const live = $("wrap").lastElementChild;
  const pre = live.querySelector("pre"), stats = live.querySelector(".who span");

  controller = new AbortController();
  $("send").textContent = "Stop"; $("send").classList.add("stop");
  const started = performance.now();
  try {
    const res = await fetch("/api/generate", {
      method: "POST", signal: controller.signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, prompt: text, temperature: +$("temp").value, max_tokens: +$("maxtok").value }),
    });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      reply.text += dec.decode(value, { stream: true });
      pre.textContent = reply.text;
      $("thread").scrollTop = $("thread").scrollHeight;
    }
    if (!reply.text) reply.text = "(the model stopped without writing anything; try again or raise Creativity)";
  } catch (e) {
    if (e.name !== "AbortError") { reply.text = reply.text || String(e.message || e); reply.error = !pre.textContent; if (reply.error) pre.className = "error"; }
    else if (!reply.text) reply.text = "(stopped)";
  }
  reply.stats = `${((performance.now() - started) / 1000).toFixed(1)}s`;
  pre.textContent = reply.text; stats.textContent = reply.stats;
  controller = null;
  $("send").textContent = "Send"; $("send").classList.remove("stop");
  save();
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  if (controller) return controller.abort();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = ""; $("input").style.height = "auto";
  send(text);
};
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } };
$("input").oninput = (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; };
$("new").onclick = () => { currentId = null; renderChats(); renderThread(); $("input").focus(); };
$("model").onchange = () => { localStorage.setItem("aviary.model", $("model").value); renderCard(); };
$("temp").oninput = () => { $("tempv").textContent = (+$("temp").value).toFixed(1); };

renderChats(); renderThread(); loadModels();
</script>
</body>
</html>
